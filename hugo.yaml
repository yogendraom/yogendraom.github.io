baseURL: "https://yogendraom.com/"
title: "Yogendra Om"
theme: ["papermod"]

params:
  env: production
  description: "Reflections on spirituality, life, and the journey within."
  author: "Yogendra Om"
  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  homeInfoParams:
    Title: "A space for slow thoughts."
    Content: >-
      Welcome to my corner of the internet. Here I write about spirituality,
      the quiet moments of everyday life, and the lessons I’m learning along
      the way. A place to reflect, share, and be present.
  socialIcons:
    - name: github
      url: "https://github.com/yogendraom"
  assets:
    disableHLJS: true

menu:
  main:
    - identifier: about
      name: About
      url: /about/
      weight: 10
    - identifier: archive
      name: Archive
      url: /archives/
      weight: 20
    - identifier: search
      name: Search
      url: /search/
      weight: 30

outputs:
  home:
    - HTML
    - RSS
    - JSON

publishDir: "docs"

taxonomies:
  tag: tags
  category: categories

minify:
  minifyOutput: true
